name: Publish Windows builds

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore "Mountain dash game/Mountain dash game.csproj"

    - name: Publish self-contained (single file)
      run: dotnet publish "Mountain dash game/Mountain dash game.csproj" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish/sc

    - name: Publish framework-dependent
      run: dotnet publish "Mountain dash game/Mountain dash game.csproj" -c Release -r win-x64 --self-contained false -o publish/fd

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish-artifacts
        path: publish
